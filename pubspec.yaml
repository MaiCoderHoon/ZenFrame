name: zen_frame
description: A minimalist focus timer app with ambient sounds and session tracking.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # In-app purchases (RevenueCat)
  purchases_flutter: ^7.3.0
  purchases_ui_flutter: ^7.3.0

  # Local persistence
  shared_preferences: ^2.2.0

  # Audio playback
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/rain.mp3
    - assets/sounds/forest.mp3
    - assets/sounds/waves.mp3